<title id="t">ctx: one CONTEXT.md per folder, state goes up, rules come down</title>
<desc id="d">A folder tree: ~, projects with app, courses with algebra and ml-intro. Each folder has an AGENTS.md card and a CONTEXT.md card. Green arrows go straight up from each CONTEXT.md to its parent CONTEXT.md, carrying a one-line summary to the root. Orange lines bring AGENTS.md rules down from each folder to its children, natively. Under ml-intro, a terminal icon (your session ends) points up into its CONTEXT.md, rewritten by one model call (document and pencil icon).</desc>
